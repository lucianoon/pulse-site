name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    # A configuração agora vem do ambiente (veja .env.example). Sem DEBUG
    # explícito o settings assume produção e exige SECRET_KEY, então a CI roda
    # justamente no modo de produção — que é o que vale verificar — com uma
    # chave descartável gerada só para esta execução.
    env:
      DEBUG: 'False'
      SECRET_KEY: 'ci-only-throwaway-key-not-used-anywhere-else-000000000000'
      ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
      # O passo do gunicorn fala HTTP em localhost; sem isto o redirect para
      # HTTPS responderia 301 e o curl não veria a página.
      SECURE_SSL_REDIRECT: 'False'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      # Impede regressão no endurecimento de produção. Roda com o redirect de
      # HTTPS ligado, ao contrário dos passos seguintes.
      - name: Django deployment check
        run: python manage.py check --deploy --fail-level WARNING
        env:
          SECURE_SSL_REDIRECT: 'True'

      - name: Run tests
        run: python manage.py test -v 2

      - name: Compile Python sources
        run: python -m compileall pulse_project home

      # O gunicorn serve o site em produção (veja o Procfile) e nada o exercitava:
      # os passos acima usam o servidor de desenvolvimento do Django. Sem isto, um
      # bump de major do gunicorn passa pela CI sem ser executado uma única vez.
      - name: Gunicorn serves the app
        run: |
          gunicorn pulse_project.wsgi --log-file - --bind 127.0.0.1:8000 &
          GUNICORN_PID=$!
          trap 'kill $GUNICORN_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8000/; then
              echo "gunicorn respondeu na tentativa $i"
              break
            fi
            if ! kill -0 $GUNICORN_PID 2>/dev/null; then
              echo "gunicorn morreu antes de responder"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8000/
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8000/contato/
